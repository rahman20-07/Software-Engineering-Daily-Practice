<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset Example</title>
</head>
<body>
    <header>
        <h3>Fieldset Example: Colors and Sports</h3>
    </header>
    <main>

            <fieldset>
                <legend>List of Colors</legend>
            <ul>
                <li>Red</li>
                <li>Blue</li>
                <li>Green</li>
                <li>Yellow</li>
            </ul>
        </fieldset>

        <fieldset>
            <legend>List of Sports</legend>
           <ol>
                <li>Soccer</li>
                <li>Basketball</li>
                <li>Cricket</li>
           </ol>
        </fieldset>
        
    </main>
    
</body>
</html>
