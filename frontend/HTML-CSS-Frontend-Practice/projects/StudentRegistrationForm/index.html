<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        body{
            background-color: rgb(219, 233, 254);
            display: flex;
            align-items: center;
            justify-content: center;
            /* height: 100vh; */
            min-height: 100vh;
            padding: 20px;
        }
        .container{
            /* border: 1px solid rgb(95, 92, 92); */
            border-radius: 12px;
            padding: 20px;
            background-color: white;
            width: 100%;
            /* min-width: 250px; */
            max-width: 420px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.25);
            
        }
        .container h1{
            /* font-size: 32px; */
            font-size: clamp(24px, 5vw, 32px);
            color: rgb(36, 99, 235);
            margin: 20px 0;
            text-align: center;
        }
        input{
            padding: 10px;
            border-radius: 6px;
            border: 2px solid gray;
            /* margin: 12px 0px;
            margin-top: 2px;  */
            margin: 5px 0 15px;
            width: 100%;
        }
        input:focus {
            outline: 2px solid rgb(36, 99, 235);
            border-color: rgb(36, 99, 235);
        }
        input:valid {
            border-color: green;
            border-left:4px solid green;
        }
        input:invalid {
            border-color: red;
            border-left: 4px solid red;
        }
        label
        {
            display: block;
            padding-left: 5px;
            font-size: 15px;
            font-weight: bold;
        }

        .terms{
            display:flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: fit-content;
            margin: 12px 0;
        }
        .terms label{
            white-space: nowrap;
            cursor: pointer;
            display: inline;
        }
        .terms input{
            width: auto;
            margin: 0;
        }
        /* .terms:required{
            color: blue;
        } */

        .terms input:checked + label {
            color: green;
        }
        .terms input:checked {
            accent-color: green;
        }

        button{
            background-color: rgb(36, 99, 235);
            width: 98%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin: 15px auto;
            margin-top: 25px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: rgba(17, 165, 0, 0.867);
            cursor: pointer;
        }

        input:read-only
        {
            background-color: rgb(235, 238, 243);
            color: rgba(90, 90, 90, 0.742);
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Registration Form</h1>
        <form>
            <label for="student-id">Student ID</label>
            <input 
                type="text"
                name="studentId"
                id="student-id"
                value="STD2026001"
                readonly>


            <label for="full-name">Full Name</label>
            <input
                type="text"
                id="full-name"
                name="fullName"
                placeholder="Enter Full Name"
                required>


            <label for="email">Email</label>
            <input 
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email"
                required>

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="18"
                max="30"
                placeholder="Enter Age"
                required>

            <div class="terms">
                <input 
                    type="checkbox"
                    id="check"
                    name="terms"
                    required>
                <label for="check">
                    I Accept Terms & Conditions
                </label>
            </div>

            <button type="submit">Register</button>

        </form>


    </div>
    
</body>
</html>
